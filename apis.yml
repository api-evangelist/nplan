name: nPlan
description: 'nPlan applies machine learning to construction project schedules to forecast
  and de-risk large capital projects. Trained on a large corpus of historical project
  schedules, its products (nPlan Insights Pro and nPlan Portfolio) analyze programme
  risk, benchmark schedules against similar projects, and surface the interventions
  most likely to keep delivery on time and on budget, with a Power BI integration for
  portfolio-level project controls. nPlan is a private enterprise SaaS company backed
  by GV (Google Ventures). As of this enrichment pass it exposes no public developer
  API, portal, or OpenAPI surface.'
